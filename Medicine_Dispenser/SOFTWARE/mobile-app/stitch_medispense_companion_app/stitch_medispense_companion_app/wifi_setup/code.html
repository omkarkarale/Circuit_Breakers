<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a healthcare technology specialist looking friendly and empathetic, lit with soft clinical blue and white light, reflecting a clean and modern high-stakes medical environment. The image uses high-key lighting and a shallow depth of field for a premium corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7enPGJe9NWxWiOJ57VzHOS_R426llmibaCl2OEG6GSxRA1HAXccSKH1bWhCc8jur_TgOAW79FFztKQDYxc5pSPLSvY3SMsCbJywtaFpQTsn40xm2sxXQziKxN0NwzqWJbyhdj2dh1fPItbuLmrQ8HO0szVhOuJRJuqeaDnEiXiHO1m6hQgS2ixsiFwBDqrAkZcAkBBh8pAZG_yXgUGFkzm2xGGbSAybWedhIXR2fmsaPeTXQiOhfdnw"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">MedLink IoT</h1>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined text-primary">notifications</span>
</button>
</header>
<main class="flex-1 w-full max-w-md px-container-padding pb-32 pt-8">
<!-- Content Area -->
<div class="space-y-stack-lg">
<!-- Setup Progress / Status Banner -->
<section class="glass-card border border-outline-variant p-6 rounded-xl shadow-sm">
<div class="flex items-center justify-between mb-4">
<div class="flex flex-col">
<span class="font-label-lg text-label-lg text-on-surface-variant">Connection Status</span>
<h2 class="font-headline-sm text-headline-sm text-error flex items-center gap-2" id="status-text">
                            Disconnected
                        </h2>
</div>
<div class="flex items-end gap-1 h-8" id="signal-strength">
<div class="w-1.5 h-1/4 bg-outline-variant rounded-full transition-all duration-500"></div>
<div class="w-1.5 h-1/2 bg-outline-variant rounded-full transition-all duration-500"></div>
<div class="w-1.5 h-3/4 bg-outline-variant rounded-full transition-all duration-500"></div>
<div class="w-1.5 h-full bg-outline-variant rounded-full transition-all duration-500"></div>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Please configure your WiFi settings to sync your IoT smart pill dispenser with our healthcare network.</p>
</section>
<!-- Device Illustration -->
<section class="flex justify-center py-4">
<div class="relative w-48 h-48 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant">

<span class="material-symbols-outlined text-primary" style="font-size: 80px;">router</span>

<!-- Input Form -->
<section class="space-y-6">
<div class="space-y-4">
<div class="relative">

<div class="relative group">
<input class="w-full h-14 px-4 pr-12 rounded-xl bg-surface-container-lowest border border-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body-md text-body-md text-on-surface" id="ssid" placeholder="Search for networks..." type="text"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">wifi_find</span>
</button>
</div>
</div>
<div class="relative">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2 ml-1" for="password">Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 pr-12 rounded-xl bg-surface-container-lowest border border-outline focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all font-body-md text-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" id="toggle-password">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>

<span class="material-symbols-outlined">arrow_forward</span>
</button>

                </button>

<a class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-1 hover:bg-surface-variant transition-all duration-200" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-1 hover:bg-surface-variant transition-all duration-200" href="#">
<span class="material-symbols-outlined">medication</span>
<span class="font-label-sm text-label-sm">Medicines</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-1 hover:bg-surface-variant transition-all duration-200" href="#">
<span class="material-symbols-outlined">medical_services</span>
<span class="font-label-sm text-label-sm">Diagnostics</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-6 py-1 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
<script>
        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.children[0].textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Mock Connect Interaction
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const signalBars = document.getElementById('signal-strength').children;

        connectBtn.addEventListener('click', () => {
            connectBtn.disabled = true;
            connectBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Connecting...';
            
            // Step 1: Searching for signal
            let delay = 0;
            [...signalBars].forEach((bar, index) => {
                setTimeout(() => {
                    bar.classList.remove('bg-outline-variant');
                    bar.classList.add('bg-primary');
                }, delay);
                delay += 500;
            });

            // Step 2: Final Success State
            setTimeout(() => {
                statusText.textContent = 'Connected';
                statusText.classList.remove('text-error');
                statusText.classList.add('text-secondary');
                statusText.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Connected';
                
                connectBtn.innerHTML = 'Device Ready';
                connectBtn.classList.remove('bg-primary');
                connectBtn.classList.add('bg-secondary');
                
                [...signalBars].forEach((bar) => {
                    bar.classList.remove('bg-primary');
                    bar.classList.add('bg-secondary');
                });
            }, 3000);
        });
    </script>
</body></html>
